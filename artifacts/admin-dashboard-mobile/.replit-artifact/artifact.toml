kind = "mobile"
previewPath = "/admin-dashboard-mobile/"
title = "Moon Crypto Admin Mobile"
version = "1.0.0"
id = "artifacts/admin-dashboard-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/admin-dashboard-mobile/" ]
localPort = 20666

[services.development]
run = "pnpm --filter @workspace/admin-dashboard-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/admin-dashboard-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/admin-dashboard-mobile", "run", "serve" ]

[services.env]
PORT = "20666"
BASE_PATH = "/admin-dashboard-mobile/"
