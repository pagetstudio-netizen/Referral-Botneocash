openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: NeoCash Admin API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: stats
    description: Dashboard statistics
  - name: users
    description: User management
  - name: withdrawals
    description: Withdrawal management
  - name: settings
    description: Bot settings
  - name: broadcast
    description: Broadcast messages
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [stats]
      summary: Get dashboard statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: banned
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResult"

  /admin/users/{telegramId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by Telegram ID
      security:
        - bearerAuth: []
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "404":
          description: User not found

  /admin/users/{telegramId}/ban:
    post:
      operationId: banUser
      tags: [users]
      summary: Ban or unban a user
      security:
        - bearerAuth: []
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /admin/users/{telegramId}/credit:
    post:
      operationId: creditUser
      tags: [users]
      summary: Credit or debit a user balance
      security:
        - bearerAuth: []
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /admin/users/{telegramId}/withdrawal-unlock:
    post:
      operationId: toggleWithdrawalUnlock
      tags: [users]
      summary: Toggle withdrawal unlock for a user
      security:
        - bearerAuth: []
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalUnlockInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /admin/withdrawals:
    get:
      operationId: listWithdrawals
      tags: [withdrawals]
      summary: List withdrawals
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of withdrawals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalListResult"

  /admin/withdrawals/{id}/approve:
    post:
      operationId: approveWithdrawal
      tags: [withdrawals]
      summary: Approve a withdrawal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalActionInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /admin/withdrawals/{id}/reject:
    post:
      operationId: rejectWithdrawal
      tags: [withdrawals]
      summary: Reject a withdrawal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalActionInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /admin/settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /admin/broadcast:
    post:
      operationId: sendBroadcast
      tags: [broadcast]
      summary: Send broadcast message
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastInput"
      responses:
        "200":
          description: Broadcast started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastResult"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LoginResult:
      type: object
      required: [token, admin]
      properties:
        token:
          type: string
        admin:
          type: object
          properties:
            email:
              type: string
            name:
              type: string
          required: [email, name]

    AdminStats:
      type: object
      required: [users, withdrawals, bonuses]
      properties:
        users:
          type: object
          properties:
            total:
              type: integer
            today:
              type: integer
            week:
              type: integer
            month:
              type: integer
            active:
              type: integer
            banned:
              type: integer
          required: [total, today, week, month, active, banned]
        withdrawals:
          type: object
          properties:
            total:
              type: integer
            pending:
              type: integer
            approved:
              type: integer
            rejected:
              type: integer
            totalApprovedAmount:
              type: integer
          required: [total, pending, approved, rejected, totalApprovedAmount]
        bonuses:
          type: object
          properties:
            total:
              type: integer
          required: [total]

    AdminUser:
      type: object
      required: [telegramId, firstName, balance, referralCount, referralEarnings, bonusEarnings, totalWithdrawn, banned, withdrawalUnlocked, createdAt]
      properties:
        telegramId:
          type: integer
        username:
          type: ["string", "null"]
        firstName:
          type: string
        lastName:
          type: ["string", "null"]
        balance:
          type: integer
        referralCode:
          type: string
        referralCount:
          type: integer
        referralEarnings:
          type: integer
        bonusEarnings:
          type: integer
        totalWithdrawn:
          type: integer
        banned:
          type: boolean
        bannedReason:
          type: ["string", "null"]
        withdrawalUnlocked:
          type: boolean
        lastActivityAt:
          type: ["string", "null"]
        createdAt:
          type: string

    UserListResult:
      type: object
      required: [users, total, page, limit]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    BanInput:
      type: object
      required: [banned]
      properties:
        banned:
          type: boolean
        reason:
          type: string

    CreditInput:
      type: object
      required: [amount, type]
      properties:
        amount:
          type: integer
        type:
          type: string
          enum: [credit, debit]

    WithdrawalUnlockInput:
      type: object
      required: [unlocked]
      properties:
        unlocked:
          type: boolean

    AdminWithdrawal:
      type: object
      required: [id, telegramId, firstName, country, countryName, operator, phone, amount, status, createdAt]
      properties:
        id:
          type: integer
        telegramId:
          type: integer
        firstName:
          type: string
        beneficiaryName:
          type: string
        username:
          type: ["string", "null"]
        country:
          type: string
        countryName:
          type: string
        operator:
          type: string
        phone:
          type: string
        amount:
          type: integer
        status:
          type: string
          enum: [pending, approved, rejected]
        adminNote:
          type: ["string", "null"]
        processedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    WithdrawalListResult:
      type: object
      required: [withdrawals, total, page, limit]
      properties:
        withdrawals:
          type: array
          items:
            $ref: "#/components/schemas/AdminWithdrawal"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    WithdrawalActionInput:
      type: object
      properties:
        note:
          type: string

    BotSettings:
      type: object
      required: [referralBonus, dailyBonus, minWithdraw, requiredChannel, requiredGroup, supportLink, supportMessage, maintenanceMode, botName, withdrawalChannel, adminGroupId]
      properties:
        referralBonus:
          type: integer
        dailyBonus:
          type: integer
        minWithdraw:
          type: integer
        requiredChannel:
          type: string
        requiredGroup:
          type: string
        supportLink:
          type: string
        supportMessage:
          type: string
        maintenanceMode:
          type: boolean
        botName:
          type: string
        withdrawalChannel:
          type: string
        adminGroupId:
          type: string

    BotSettingsInput:
      type: object
      properties:
        referralBonus:
          type: integer
        dailyBonus:
          type: integer
        minWithdraw:
          type: integer
        requiredChannel:
          type: string
        requiredGroup:
          type: string
        supportLink:
          type: string
        supportMessage:
          type: string
        maintenanceMode:
          type: boolean
        botName:
          type: string
        withdrawalChannel:
          type: string
        adminGroupId:
          type: string

    BroadcastInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
        buttonLabel:
          type: string
        buttonUrl:
          type: string

    BroadcastResult:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
        message:
          type: string

    SuccessMessage:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
